name: Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (F821)
        run: |
          ruff check . --select F821 --exclude venv --exclude __pycache__ --exclude backups --exclude logs --exclude _releases --exclude "scripts/Activate.ps1"

      - name: Validate Handlers
        run: |
          python scripts/validate_handlers.py

      - name: Py Compile
        run: |
          python -c "import py_compile; py_compile.compile('main.py', doraise=True)"

      - name: Pytest
        run: |
          python -m pytest -q

      - name: Pyright
        run: |
          python -m pyright
