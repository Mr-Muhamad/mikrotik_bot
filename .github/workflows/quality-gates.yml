name: Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create Dummy .env for CI
        run: |
          echo "BOT_TOKEN=ci_dummy_token" > .env
          echo "ADMIN_IDS=724730774" >> .env
          echo "ENCRYPTION_KEY=MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=" >> .env

      - name: Ruff
        run: ruff check .

      - name: Validate Handlers
        run: |
          python scripts/validate_handlers.py

      - name: Validate RouterOS Paths
        run: python scripts/validate_routeros_paths.py

      - name: Check Type Ignore
        run: python scripts/check_type_ignore.py

      - name: Py Compile
        run: |
          python -c "import py_compile; py_compile.compile('main.py', doraise=True)"

      - name: Pytest + Coverage
        run: |
          python -m pytest --cov=bot --cov=core --cov=database --cov=utils --cov=pdf --cov-fail-under=80 -q

      - name: Pyright
        run: |
          python -m pyright
